<script>

{% block stylesheets %}
<style>

}

.Conservatives{

}
.Labour{
  fill:#e25050;

}
.Liberal.Democrats{

  stroke:none;
}
.UKIP{
  fill:#ca6dbf;
  stroke:none;
}
.Greens{
  fill:#65a68c;

  stroke:none;
